# nginx for the Unified Social Club backend, same pattern as nginx_flask_8587.conf.
# usc.opencodingsociety.com is our requested name; use whatever subdomain Mr. Mortensen assigns.
# After DNS points at the server: sudo certbot --nginx -d usc.opencodingsociety.com
server {
    listen 80;
    listen [::]:80;
    server_name usc.opencodingsociety.com;

    location / {
        proxy_pass http://localhost:8588;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Only our site and OCS pages may call this API with cookies.
        set $cors_origin "";
        if ($http_origin ~* "^https://(.*\.)?opencodingsociety\.com$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin = "https://unified-social-club-csp.github.io") {
            set $cors_origin $http_origin;
        }
        add_header "Access-Control-Allow-Origin" "$cors_origin" always;
        add_header "Access-Control-Allow-Credentials" "true" always;

        if ($request_method = OPTIONS) {
            add_header "Access-Control-Allow-Origin" "$cors_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS, HEAD" always;
            add_header "Access-Control-Allow-MaxAge" 600 always;
            add_header "Access-Control-Allow-Headers" "Authorization, Origin, X-Origin, X-Requested-With, Content-Type, Accept" always;
            return 204;
        }
    }
}
